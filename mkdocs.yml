site_name: Partners Portal
site_description: Hands-on guide for adding and updating employees with the Nmbrs API
site_url: https://example.com
use_directory_urls: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: 
    - Understanding REST APIs: getting-started/understanding-rest-apis.md
    - How to authenticate: getting-started/how-to-authenticate.md
    - How to integrate your HRIS: getting-started/how-to-integrate-your-hris.md
    - HTTP status codes: getting-started/http-status-codes.md
  - Integration Guides:
    - Introduction: guide/index.md
    - Managing Employees: guide/manage-employees.md

theme:
  name: 'material'
  favicon: assets/images/nmbrs-main-logo-icon-2.webp
  logo: assets/images/nmbrs.png
  font: 
    text: Lato
  palette:
    - scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  features:
  # content UX
    - content.tabs.link # allow linking directly to tabs
    - content.code.copy # copy button on code blocks
    - navigation.instant # faster page transitions
    - navigation.tracking # update URL fragment on scroll
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false
      auto_title: false
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - md_in_html
  - attr_list
  - tables
  - toc:  
      permalink: true # clickable anchors for headings
      permalink: "#"           # use a hashtag instead of ¶
      permalink_title: "Link to this heading"
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

icon: # Maps custom MkDocs icons to different types of admonitions (alerts or messages), using icons from the Octicons set.
  admonition:
    note: octicons/tag-16
    abstract: octicons/checklist-16
    info: octicons/info-16
    tip: octicons/squirrel-16
    success: octicons/check-16
    question: octicons/question-16
    warning: octicons/alert-16
    failure: octicons/x-circle-16
    danger: octicons/zap-16
    bug: octicons/bug-16
    example: octicons/beaker-16
    quote: octicons/quote-16